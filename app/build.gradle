plugins { id 'com.android.application' }

def tagVersion = providers.environmentVariable('APP_VERSION').orElse('v1.3.1').get()
if (!(tagVersion ==~ /v?(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)/)) {
    throw new GradleException('Version must be vMAJOR.MINOR.PATCH with each component between 0 and 99')
}
def appVersion = tagVersion.replaceFirst('^v', '')
def parts = appVersion.tokenize('.').collect { it.toInteger() }
def signingFile = providers.environmentVariable('SIGNING_STORE_FILE').orNull

android {
    namespace 'local.mediarescan'
    compileSdk 35
    defaultConfig {
        applicationId 'local.mediarescan'
        minSdk 30
        targetSdk 35
        versionCode parts[0] * 10000 + parts[1] * 100 + parts[2]
        versionName appVersion
    }
    signingConfigs {
        if (signingFile) {
            release {
                storeFile file(signingFile)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (signingFile) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}
dependencies {
    implementation 'com.google.android.material:material:1.13.0'
    testImplementation 'junit:junit:4.13.2'
}
